# Запасной «бот» на GitHub Actions (если не используете Netlify Scheduled Functions).
# Раз в час тянет данные сборов и коммитит data/history.json в репозиторий.
# Чтобы включить: уберите data/ из .gitignore и оставьте этот workflow.

name: collect-savings

on:
  schedule:
    - cron: '0 * * * *' # каждый час
  workflow_dispatch: {} # ручной запуск кнопкой

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Собрать снимок
        run: node --experimental-strip-types scripts/collect-local.ts

      - name: Закоммитить историю
        run: |
          git config user.name "savings-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/history.json
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "chore: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
